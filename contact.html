<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2M Sembako — Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/output.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-brands/css/uicons-brands.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>
<body data-page="contact" class="bg-canvas text-ink font-body flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="flex-grow">
    <div class="bg-surface border-b border-ink/10">
      <section class="max-w-7xl mx-auto px-4 py-16">
        <span class="block w-12 h-1 bg-primary rounded-full mb-4"></span>
        <h1 class="font-display font-bold uppercase tracking-tight text-4xl text-ink">Hubungi Kami</h1>
        <p class="font-body text-ink-muted mt-4 max-w-xl">
          Ada pertanyaan seputar produk atau cabang terdekat? Sapa kami langsung via WhatsApp.
        </p>

        <a href="https://wa.me/" data-wa-link target="_blank" rel="noopener noreferrer"
           class="mt-8 inline-flex bg-primary hover:bg-secondary text-white rounded-full px-6 py-3 items-center gap-2 font-bold uppercase tracking-wide text-sm shadow-sm hover:-translate-y-0.5 transition-all">
          <i class="fi fi-brands-whatsapp" aria-hidden="true"></i> Chat via WA
        </a>

        <div class="mt-10 flex items-center gap-6">
          <a href="https://www.instagram.com/2msembako/" target="_blank" rel="noopener noreferrer"
             class="inline-flex items-center gap-2 font-display font-bold uppercase text-sm tracking-wider text-ink hover:text-primary transition">
            <i class="fi fi-brands-instagram" aria-hidden="true"></i> Instagram
          </a>

          <span class="opacity-50 pointer-events-none inline-flex items-center gap-2 font-display font-bold uppercase text-sm tracking-wider text-ink-muted">
            <i class="fi fi-brands-tik-tok" aria-hidden="true"></i> TikTok (segera hadir)
          </span>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
