<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2M Sembako - Admin CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <nav class="bg-blue-800 text-white p-4">
        <div class="container mx-auto flex justify-between">
            <h1 class="text-xl font-bold">2M Sembako Admin</h1>
            <div class="space-x-4">
                <a href="/admin/promos/" class="hover:underline">Promos</a>
                <a href="/admin/products/" class="hover:underline">Products</a>
                <a href="/admin/featured-products/" class="hover:underline">Featured Products</a>
                <a href="/admin/news/" class="hover:underline">News</a>
                <a href="/admin/branches/" class="hover:underline">Branches</a>
            </div>
        </div>
    </nav>
    <main class="container mx-auto mt-8 p-4 bg-white shadow rounded">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
