{% extends "admin/base.html" %}

{% block content %}
<h2 class="text-2xl font-semibold mb-6">{{ "Edit Produk Unggulan" if featured_product else "Tambah Produk Unggulan" }}</h2>

<form action="{{ '/admin/featured-products/' ~ featured_product.id ~ '/edit' if featured_product else '/admin/featured-products/create' }}" method="POST" class="max-w-lg space-y-4">
    <div>
        <label class="block mb-1 font-medium">Produk</label>
        <select name="product_id" required class="w-full border p-2 rounded">
            <option value="" disabled {{ "selected" if not featured_product else "" }}>Pilih produk...</option>
            {% for product in products %}
            <option value="{{ product.id }}" {{ "selected" if featured_product and featured_product.product_id == product.id else "" }}>{{ product.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label class="block mb-1 font-medium">URL Gambar Custom (opsional)</label>
        <input type="text" name="image_url" value="{{ (featured_product.image_url or '') if featured_product else '' }}" placeholder="Kosongkan untuk fallback ke gambar produk" class="w-full border p-2 rounded">
    </div>
    <div>
        <label class="block mb-1 font-medium">Posisi</label>
        <input type="number" name="position" value="{{ featured_product.position if featured_product else '' }}" required class="w-full border p-2 rounded">
    </div>
    <div class="flex space-x-4 pt-4">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">{{ "Update" if featured_product else "Simpan" }}</button>
        <a href="/admin/featured-products/" class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400">Batal</a>
    </div>
</form>
{% endblock %}
