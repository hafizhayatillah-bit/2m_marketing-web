{% extends "admin/base.html" %}

{% block content %}
<h2 class="text-2xl font-semibold mb-6">{{ "Edit Cabang" if branch else "Tambah Cabang Baru" }}</h2>

<form action="{{ '/admin/branches/' ~ branch.id ~ '/edit' if branch else '/admin/branches/create' }}" method="POST" class="max-w-lg space-y-4">
    <div>
        <label class="block mb-1 font-medium">Nama Cabang</label>
        <input type="text" name="name" value="{{ branch.name if branch else '' }}" required class="w-full border p-2 rounded">
    </div>
    <div>
        <label class="block mb-1 font-medium">Alamat</label>
        <textarea name="address" required class="w-full border p-2 rounded">{{ branch.address if branch else '' }}</textarea>
    </div>
    <div>
        <label class="block mb-1 font-medium">Kota</label>
        <input type="text" name="city" value="{{ branch.city if branch else '' }}" required class="w-full border p-2 rounded">
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block mb-1 font-medium">Latitude</label>
            <input type="number" step="any" name="latitude" value="{{ branch.latitude if branch else '' }}" required class="w-full border p-2 rounded">
        </div>
        <div>
            <label class="block mb-1 font-medium">Longitude</label>
            <input type="number" step="any" name="longitude" value="{{ branch.longitude if branch else '' }}" required class="w-full border p-2 rounded">
        </div>
    </div>
    <div>
        <label class="block mb-1 font-medium">Nomor WhatsApp</label>
        <input type="text" name="whatsapp_number" value="{{ branch.whatsapp_number if branch else '' }}" required class="w-full border p-2 rounded">
    </div>
    <div>
        <label class="block mb-1 font-medium">Jam Operasional</label>
        <input type="text" name="operating_hours" value="{{ branch.operating_hours if branch else '' }}" required class="w-full border p-2 rounded" placeholder="08:00-17:00">
    </div>
    <div>
        <label class="block mb-1 font-medium">Tag Kategori (pisahkan koma)</label>
        <input type="text" name="category_tags" value="{{ branch.category_tags|join(', ') if branch else '' }}" class="w-full border p-2 rounded" placeholder="sembako, grosir">
    </div>
    <div>
        <label class="block mb-1 font-medium">URL Google Maps</label>
        <input type="text" name="google_maps_url" value="{{ (branch.google_maps_url or '') if branch else '' }}" class="w-full border p-2 rounded">
    </div>
    <div>
        <label class="block mb-1 font-medium">URL Google Drive</label>
        <input type="text" name="google_drive_url" value="{{ (branch.google_drive_url or '') if branch else '' }}" class="w-full border p-2 rounded">
    </div>
    <div class="flex space-x-4 pt-4">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">{{ "Update" if branch else "Simpan" }}</button>
        <a href="/admin/branches/" class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400">Batal</a>
    </div>
</form>
{% endblock %}
