{% extends "admin/base.html" %}

{% block content %}
<div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-semibold">Daftar Produk</h2>
    <a href="/admin/products/create" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Tambah Produk</a>
</div>

<table class="w-full text-left border-collapse">
    <thead>
        <tr class="bg-gray-200">
            <th class="p-3 border">Nama</th>
            <th class="p-3 border">Kategori</th>
            <th class="p-3 border">Status</th>
            <th class="p-3 border">Aksi</th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td class="p-3 border">{{ product.name }}</td>
            <td class="p-3 border">{{ product.category }}</td>
            <td class="p-3 border">{{ "Aktif" if product.is_active else "Nonaktif" }}</td>
            <td class="p-3 border space-x-2 whitespace-nowrap">
                <a href="/admin/products/{{ product.id }}/edit" class="text-blue-600 hover:underline">Edit</a>
                <form action="/admin/products/{{ product.id }}/toggle-active" method="POST" class="inline">
                    <button type="submit" class="text-amber-600 hover:underline">{{ "Nonaktifkan" if product.is_active else "Aktifkan" }}</button>
                </form>
                <form action="/admin/products/{{ product.id }}/delete" method="POST" class="inline" onsubmit="return confirm('Yakin hapus produk ini?')">
                    <button type="submit" class="text-red-600 hover:underline">Hapus</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4" class="p-3 border text-center text-gray-500">Belum ada data produk.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
