{% extends "admin/base.html" %}

{% block content %}
<h2 class="text-2xl font-semibold mb-6">{{ "Edit Berita" if news else "Tambah Berita Baru" }}</h2>

<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">

<form id="news-form" action="{{ '/admin/news/' ~ news.id ~ '/edit' if news else '/admin/news/create' }}" method="POST" enctype="multipart/form-data" class="max-w-lg space-y-4">
    <div>
        <label class="block mb-1 font-medium">Judul</label>
        <input type="text" name="title" value="{{ news.title if news else '' }}" required class="w-full border p-2 rounded">
    </div>
    <div>
        <label class="block mb-1 font-medium">Tanggal Event</label>
        <input type="date" name="event_date" value="{{ news.event_date if news else '' }}" required class="w-full border p-2 rounded">
    </div>
    <div>
        <label class="block mb-1 font-medium">Tag / Kategori</label>
        <input type="text" name="tag" value="{{ (news.tag or '') if news else '' }}" placeholder="Mis. Perusahaan, Kegiatan Sosial, Kemitraan (bebas/manual)" class="w-full border p-2 rounded">
    </div>
    <div>
        <label class="block mb-1 font-medium">Abstrak / Ringkasan</label>
        <textarea name="excerpt" rows="3" maxlength="220" class="w-full border p-2 rounded">{{ (news.excerpt or '') if news else '' }}</textarea>
        <p class="text-xs text-gray-500 mt-1">Tampil di card, maksimal 3 baris / 1 paragraf singkat.</p>
    </div>
    <div>
        <label class="block mb-1 font-medium">Konten</label>
        <div id="content-editor" class="bg-white" style="height: 220px;">{{ (news.content | safe) if news else '' }}</div>
        <textarea name="content" id="content-input" class="hidden">{{ news.content if news else '' }}</textarea>
    </div>
    <div>
        <label class="block mb-1 font-medium">URL Gambar</label>
        <input type="text" name="image_url" value="{{ (news.image_url or '') if news else '' }}" class="w-full border p-2 rounded">
        {% if news and news.image_url %}
        <img src="{{ news.image_url }}" alt="Preview" class="mt-2 h-24 rounded border object-cover">
        {% endif %}
    </div>
    <div>
        <label class="block mb-1 font-medium">Upload Gambar (opsional, akan menimpa URL manual)</label>
        <input type="file" name="image_file" accept="image/*" class="w-full border p-2 rounded">
    </div>
    <div class="flex space-x-4 pt-4">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">{{ "Update" if news else "Simpan" }}</button>
        <a href="/admin/news/" class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400">Batal</a>
    </div>
</form>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script>
    const quill = new Quill("#content-editor", {
        theme: "snow",
        modules: {
            toolbar: [
                [{ header: [1, 2, 3, false] }],
                ["bold", "italic", "underline"],
                [{ list: "ordered" }, { list: "bullet" }],
                ["link", "clean"],
            ],
        },
    });

    // Quill renders its own DOM node; keep the plain textarea in sync so the
    // server still receives content as a normal form field.
    document.getElementById("news-form").addEventListener("submit", () => {
        document.getElementById("content-input").value = quill.root.innerHTML;
    });
</script>
{% endblock %}
