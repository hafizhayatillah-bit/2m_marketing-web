{% extends "base.html" %}

{% block title %}Katalog Produk — 2M Sembako{% endblock %}

{% block content %}
<section class="bg-blue-50 py-12 border-b border-blue-100">
    <div class="max-w-7xl mx-auto px-4 text-center">
        <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-4">Katalog Produk</h1>
        <p class="text-slate-600 max-w-2xl mx-auto">Ketersediaan lengkap bahan pokok dan kebutuhan harian di seluruh cabang 2M Sembako.</p>
    </div>
</section>

<section class="max-w-7xl mx-auto px-4 py-8">
    <!-- Filter Kategori Dinamis -->
    <div id="filter-container" class="flex flex-wrap justify-center gap-3 mb-12">
        <button class="filter-btn active bg-blue-700 text-white px-5 py-2 rounded-full text-sm font-semibold transition-colors shadow-sm" data-filter="all">Semua Kategori</button>
        <!-- Tombol kategori lain akan di-inject via JS -->
    </div>

    <!-- Container Produk -->
    <div id="product-container">
        <!-- Skeleton Loading -->
        <div class="animate-pulse flex gap-4 justify-center">
            <div class="bg-slate-200 h-48 w-48 rounded-2xl"></div>
            <div class="bg-slate-200 h-48 w-48 rounded-2xl"></div>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const productContainer = document.getElementById("product-container");
        const filterContainer = document.getElementById("filter-container");

        try {
            const response = await fetch('/api/v1/public/products');
            if (!response.ok) throw new Error("Gagal mengambil data produk");
            
            const products = await response.json();
            productContainer.innerHTML = ""; // Bersihkan loading state

            if (products.length === 0) {
                productContainer.innerHTML = "<p class='text-center text-slate-500'>Katalog produk sedang kosong.</p>";
                return;
            }

            // Ekstrak kategori unik dari data produk
            const uniqueCategories = [...new Set(products.map(p => p.category))];

            // Buat tombol filter untuk tiap kategori
            uniqueCategories.forEach(cat => {
                const btn = document.createElement("button");
                btn.className = "filter-btn bg-white border border-slate-200 text-slate-600 hover:border-blue-700 px-5 py-2 rounded-full text-sm font-semibold transition-colors shadow-sm";
                btn.setAttribute("data-filter", cat);
                btn.textContent = cat;
                filterContainer.appendChild(btn);
            });

            // Kelompokkan produk berdasarkan kategori
            uniqueCategories.forEach(cat => {
                const categoryProducts = products.filter(p => p.category === cat);
                
                // Buat section per kategori
                const sectionHTML = `
                    <div class="category-section mb-12" data-category="${cat}">
                        <h2 class="text-xl font-bold text-slate-800 mb-6 border-b border-slate-200 pb-2">${cat}</h2>
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                            ${categoryProducts.map(p => {
                                const imgUrl = p.image_url || 'https://images.unsplash.com/photo-1627485937980-221c88ce04ea?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80';
                                return `
                                    <div class="bg-white rounded-2xl p-3 border border-slate-100 shadow-sm hover:shadow-md transition-shadow text-center flex flex-col h-full">
                                        <div class="bg-slate-50 rounded-xl mb-3 h-32 overflow-hidden flex items-center justify-center shrink-0">
                                            <img src="${imgUrl}" alt="${p.name}" class="object-cover w-full h-full">
                                        </div>
                                        <h3 class="font-bold text-slate-800 text-sm mt-1 line-clamp-2">${p.name}</h3>
                                        <p class="text-xs text-slate-500 mt-2 line-clamp-2 mt-auto">${p.description || ''}</p>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                productContainer.innerHTML += sectionHTML;
            });

            // Logika Client-Side Filtering
            const filterBtns = document.querySelectorAll('.filter-btn');
            const categorySections = document.querySelectorAll('.category-section');

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Reset class tombol
                    filterBtns.forEach(b => {
                        b.classList.remove('bg-blue-700', 'text-white');
                        b.classList.add('bg-white', 'text-slate-600');
                    });
                    // Aktifkan tombol yang diklik
                    btn.classList.remove('bg-white', 'text-slate-600');
                    btn.classList.add('bg-blue-700', 'text-white');

                    const targetCat = btn.getAttribute('data-filter');

                    // Tampilkan/sembunyikan section kategori
                    categorySections.forEach(sec => {
                        if (targetCat === 'all' || sec.getAttribute('data-category') === targetCat) {
                            sec.style.display = 'block';
                        } else {
                            sec.style.display = 'none';
                        }
                    });
                });
            });

        } catch (error) {
            console.error("Fetch Error:", error);
            productContainer.innerHTML = "<p class='text-center text-red-500'>Gagal memuat katalog. Silakan coba lagi.</p>";
        }
    });
</script>
{% endblock %}
