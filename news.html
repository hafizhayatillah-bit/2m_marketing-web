<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2M Sembako — News</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn-uicons.flaticon.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://code.iconify.design">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/output.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-brands/css/uicons-brands.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body data-page="news" class="bg-canvas text-ink font-body flex flex-col min-h-screen">
  <div id="page-loader"><div class="text-center"><div class="page-loader__brand">2M<span>Sembako</span></div><div class="page-loader__bar"></div></div></div>
  <div id="site-header"></div>

  <main class="flex-grow">
    <div class="bg-gradient-to-b from-primary/10 to-surface border-b border-ink/10 pt-16 md:pt-20">
      <section class="max-w-7xl mx-auto px-4 py-16 md:py-20" data-animate>
        <div>
          <span class="inline-block font-display font-bold uppercase tracking-widest text-xs text-primary mb-3">Update Terbaru</span>
          <h1 class="font-display font-bold uppercase tracking-tight text-4xl text-ink">Info &amp; Event</h1>
          <p class="font-body text-ink-muted mt-4 max-w-xl">Promo, event, dan kabar terbaru dari seluruh cabang 2M Sembako — biar kamu selalu update.</p>

          <div class="mt-6 flex flex-wrap gap-3">
            <span class="inline-flex items-center gap-2 bg-primary/10 text-primary text-xs font-display font-bold uppercase tracking-wide px-3 py-1.5 rounded-full">
              <i class="fa-solid fa-tags" aria-hidden="true"></i> Promo
            </span>
            <span class="inline-flex items-center gap-2 bg-secondary/10 text-secondary text-xs font-display font-bold uppercase tracking-wide px-3 py-1.5 rounded-full">
              <i class="fa-solid fa-calendar-days" aria-hidden="true"></i> Event
            </span>
            <span class="inline-flex items-center gap-2 bg-accent/30 text-ink text-xs font-display font-bold uppercase tracking-wide px-3 py-1.5 rounded-full">
              <i class="fa-solid fa-newspaper" aria-hidden="true"></i> News
            </span>
          </div>
        </div>
      </section>
    </div>

    <div class="relative overflow-hidden bg-gradient-to-b from-secondary/10 via-canvas to-primary/10 border-t border-ink/10">
      <div class="absolute top-10 left-0 w-72 h-72 bg-primary/10 rounded-full blur-3xl" aria-hidden="true"></div>
      <div class="absolute bottom-0 right-0 w-96 h-96 bg-secondary/10 rounded-full blur-3xl" aria-hidden="true"></div>

      <section class="relative max-w-7xl mx-auto px-4 py-12 md:py-16">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-body text-sm text-ink-muted">Menampilkan:</span>
            <span class="inline-flex items-center gap-1.5 bg-primary/10 text-primary text-xs font-display font-bold uppercase tracking-wide px-3 py-1.5 rounded-full">
              <i id="news-active-filter-icon" class="fa-solid fa-arrow-down-wide-short text-[11px]" aria-hidden="true"></i>
              <span id="news-active-filter-label">Terbaru</span>
            </span>
          </div>

          <div class="relative" id="news-filter-dropdown">
            <button id="news-filter-toggle" type="button"
              class="inline-flex items-center gap-2 bg-surface border border-ink/10 rounded-full px-4 py-2 text-sm font-display font-bold uppercase tracking-wide text-ink shadow-sm hover:border-primary/40 hover:shadow-md transition-all duration-300">
              <i class="fa-solid fa-sliders text-xs" aria-hidden="true"></i> Filter
              <i id="news-filter-chevron" class="fa-solid fa-chevron-down text-[10px] transition-transform duration-300" aria-hidden="true"></i>
            </button>

            <div id="news-filter-menu" class="hidden opacity-0 scale-95 origin-top-right transition-all duration-150 absolute right-0 mt-2 w-48 bg-surface rounded-2xl border border-ink/10 shadow-xl overflow-hidden z-20">
              <button type="button" data-filter="newest"
                class="news-filter-option w-full flex items-center justify-between gap-2 px-4 py-3 text-sm font-body text-ink hover:bg-primary/10 hover:text-primary transition-colors duration-200">
                <span class="flex items-center gap-2"><i class="fa-solid fa-arrow-down-wide-short text-xs" aria-hidden="true"></i> Terbaru</span>
                <i class="fa-solid fa-check text-xs news-filter-check opacity-0 transition-opacity duration-200" aria-hidden="true"></i>
              </button>
              <button type="button" data-filter="all"
                class="news-filter-option w-full flex items-center justify-between gap-2 px-4 py-3 text-sm font-body text-ink hover:bg-primary/10 hover:text-primary transition-colors duration-200 border-t border-ink/5">
                <span class="flex items-center gap-2"><i class="fa-solid fa-layer-group text-xs" aria-hidden="true"></i> Semua</span>
                <i class="fa-solid fa-check text-xs news-filter-check opacity-0 transition-opacity duration-200" aria-hidden="true"></i>
              </button>
              <button type="button" data-filter="oldest"
                class="news-filter-option w-full flex items-center justify-between gap-2 px-4 py-3 text-sm font-body text-ink hover:bg-primary/10 hover:text-primary transition-colors duration-200 border-t border-ink/5">
                <span class="flex items-center gap-2"><i class="fa-solid fa-arrow-up-short-wide text-xs" aria-hidden="true"></i> Terlama</span>
                <i class="fa-solid fa-check text-xs news-filter-check opacity-0 transition-opacity duration-200" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>

        <p id="news-loading" class="font-body text-ink-muted">Memuat berita...</p>
        <p id="news-empty" class="hidden font-body text-ink-muted">Belum ada event/berita terbaru saat ini.</p>
        <p id="news-error" class="hidden font-body text-ink-muted">Berita belum bisa dimuat, coba lagi nanti.</p>

        <div id="news-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <!-- Article detail modal: hidden by default, populated on-demand when a card is clicked -->
  <div id="news-modal" class="hidden fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-ink/60 backdrop-blur-sm p-4 md:p-8 opacity-0 transition-opacity duration-300">
    <div id="news-modal-panel" class="relative bg-surface rounded-2xl max-w-2xl w-full my-8 shadow-2xl overflow-hidden opacity-0 scale-95 translate-y-4 transition-all duration-300">
      <div class="p-6 md:p-8">
        <div class="flex justify-between items-center mb-4">
          <div class="flex items-center gap-2">
            <span id="news-modal-date" class="inline-block font-body text-xs font-bold uppercase tracking-wide text-primary bg-primary/10 px-3 py-1 rounded-full"></span>
            <span id="news-modal-tag" class="hidden font-body text-xs font-bold uppercase tracking-wide text-secondary"></span>
          </div>
          <button id="news-modal-close" type="button" class="w-9 h-9 flex items-center justify-center bg-canvas text-ink shadow-sm rounded-full hover:bg-primary hover:text-white hover:rotate-90 transition-all duration-300" aria-label="Tutup">
            <i class="fa-solid fa-xmark text-lg" aria-hidden="true"></i>
          </button>
        </div>
        <div id="news-modal-image-wrap" class="hidden rounded-2xl overflow-hidden mb-6">
          <img id="news-modal-image" src="" alt="" class="w-full h-64 md:h-72 object-cover">
        </div>
        <h2 id="news-modal-title" class="font-display font-bold uppercase tracking-tight text-2xl md:text-3xl text-ink mb-4"></h2>
        <div id="news-modal-content" class="prose prose-sm md:prose-base max-w-none"></div>
      </div>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/page-loader.js"></script>
  <script src="/assets/js/partials.js"></script>
  <script src="/assets/js/scrollObserver.js"></script>
  <!-- <script src="/assets/js/cursor.js"></script> --> <!-- custom cursor on hold -->
  <script src="/assets/js/news.js"></script>
</body>
</html>
