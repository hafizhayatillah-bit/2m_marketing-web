<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2M Sembako — News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/output.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-brands/css/uicons-brands.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body data-page="news" class="bg-canvas text-ink font-body flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="flex-grow">
    <div class="bg-surface border-b border-ink/10">
      <section class="max-w-7xl mx-auto px-4 py-16">
        <span class="block w-12 h-1 bg-primary rounded-full mb-4"></span>
        <h1 class="font-display font-bold uppercase tracking-tight text-4xl text-ink">Info &amp; Event</h1>
        <p class="font-body text-ink-muted mt-4 max-w-xl">Info dan event terbaru dari 2M Sembako.</p>
      </section>
    </div>

    <section class="max-w-7xl mx-auto px-4 py-12 md:py-16">
      <p id="news-loading" class="font-body text-ink-muted">Memuat berita...</p>
      <p id="news-empty" class="hidden font-body text-ink-muted">Belum ada event/berita terbaru saat ini.</p>
      <p id="news-error" class="hidden font-body text-ink-muted">Berita belum bisa dimuat, coba lagi nanti.</p>

      <div id="news-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <!-- Article detail modal: hidden by default, populated on-demand when a card is clicked -->
  <div id="news-modal" class="hidden fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-ink/50 p-4 md:p-8">
    <div class="bg-surface rounded-2xl max-w-2xl w-full my-8 shadow-xl">
      <div class="flex justify-end p-3">
        <button id="news-modal-close" type="button" class="text-ink-muted hover:text-ink" aria-label="Tutup">
          <iconify-icon icon="lucide:x" width="24"></iconify-icon>
        </button>
      </div>
      <div class="px-6 pb-8">
        <img id="news-modal-image" src="" alt="" class="hidden w-full max-h-[400px] object-cover mx-auto block rounded-xl mb-6">
        <span id="news-modal-date" class="font-body text-sm text-ink-muted"></span>
        <h2 id="news-modal-title" class="font-display font-bold uppercase tracking-tight text-2xl md:text-3xl text-ink mt-1 mb-4"></h2>
        <div id="news-modal-content" class="prose prose-sm md:prose-base max-w-none"></div>
      </div>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/partials.js"></script>
  <script src="/assets/js/news.js"></script>
</body>
</html>
