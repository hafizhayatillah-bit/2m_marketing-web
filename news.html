<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="canonical" href="https://2msembako.id/news">

  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <meta property="og:site_name" content="2M Sembako">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body data-page="news" class="bg-primary/5 text-ink font-body flex flex-col min-h-screen">
  <div id="page-loader"><div class="text-center"><div class="page-loader__brand">Loading</div><div class="page-loader__bar"></div></div></div>
  <div id="site-header"></div>

  <main class="flex-grow flex flex-col">
    <div class="bg-gradient-to-b from-ink to-ocean border-b border-white/10 pt-16 md:pt-20">
      <section class="max-w-7xl mx-auto px-4 py-12 md:py-20" data-animate>
        <div>
          <span class="inline-block font-display font-bold uppercase tracking-widest text-xs text-white/70 mb-3">Update Terbaru</span>
          <h1 class="font-display font-bold uppercase tracking-tight text-4xl md:text-5xl text-white">Info &amp; Event</h1>
          <p class="font-body text-white/70 mt-4 max-w-xl">Promo, event, dan kabar terbaru dari seluruh cabang 2M Sembako — biar kamu selalu update.</p>

          <div class="mt-6 flex flex-wrap gap-3">
            <span class="inline-flex items-center gap-2 bg-ocean/30 text-white text-xs font-display font-bold uppercase tracking-wide px-3 py-1.5 rounded-full border border-white/10">
              <i class="fa-solid fa-tags" aria-hidden="true"></i> Promo
            </span>
            <span class="inline-flex items-center gap-2 bg-white/10 text-white text-xs font-display font-bold uppercase tracking-wide px-3 py-1.5 rounded-full border border-white/10">
              <i class="fa-solid fa-calendar-days" aria-hidden="true"></i> Event
            </span>
            <span class="inline-flex items-center gap-2 bg-ocean/30 text-white text-xs font-display font-bold uppercase tracking-wide px-3 py-1.5 rounded-full border border-white/10">
              <i class="fa-solid fa-newspaper" aria-hidden="true"></i> News
            </span>
          </div>
        </div>
      </section>
    </div>

    <div class="flex-grow relative bg-gradient-to-b from-secondary/10 via-canvas to-primary/10 border-t border-ink/10">
      <div class="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
        <div class="absolute top-10 left-0 w-72 h-72 bg-primary/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-secondary/10 rounded-full blur-3xl"></div>
      </div>

      <section class="relative max-w-7xl mx-auto px-4 py-10 md:py-16 min-h-[22rem]">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-body text-sm text-ink-muted">Menampilkan:</span>
            <span class="inline-flex items-center gap-1.5 bg-primary/10 text-primary text-xs font-display font-bold uppercase tracking-wide px-3 py-1.5 rounded-full">
              <i id="news-active-filter-icon" class="fa-solid fa-arrow-down-wide-short text-[11px]" aria-hidden="true"></i>
              <span id="news-active-filter-label">Terbaru</span>
            </span>
          </div>

          <div class="relative" id="news-filter-dropdown">
            <button id="news-filter-toggle" type="button"
              class="inline-flex items-center gap-2 bg-surface border border-ink/10 rounded-full px-4 py-2 text-sm font-display font-bold uppercase tracking-wide text-ink shadow-sm hover:border-primary/40 hover:shadow-md transition-all duration-300">
              <i class="fa-solid fa-sliders text-xs" aria-hidden="true"></i> Filter
              <i id="news-filter-chevron" class="fa-solid fa-chevron-down text-[10px] transition-transform duration-300" aria-hidden="true"></i>
            </button>

            <div id="news-filter-menu" class="hidden opacity-0 scale-95 origin-top-right transition-all duration-150 absolute right-0 mt-2 w-48 bg-surface rounded-2xl border border-ink/10 shadow-xl overflow-hidden z-20">
              <button type="button" data-filter="newest"
                class="news-filter-option w-full flex items-center justify-between gap-2 px-4 py-3 text-sm font-body text-ink hover:bg-primary/10 hover:text-primary transition-colors duration-200">
                <span class="flex items-center gap-2"><i class="fa-solid fa-arrow-down-wide-short text-xs" aria-hidden="true"></i> Terbaru</span>
                <i class="fa-solid fa-check text-xs news-filter-check opacity-0 transition-opacity duration-200" aria-hidden="true"></i>
              </button>
              <button type="button" data-filter="all"
                class="news-filter-option w-full flex items-center justify-between gap-2 px-4 py-3 text-sm font-body text-ink hover:bg-primary/10 hover:text-primary transition-colors duration-200 border-t border-ink/5">
                <span class="flex items-center gap-2"><i class="fa-solid fa-layer-group text-xs" aria-hidden="true"></i> Semua</span>
                <i class="fa-solid fa-check text-xs news-filter-check opacity-0 transition-opacity duration-200" aria-hidden="true"></i>
              </button>
              <button type="button" data-filter="oldest"
                class="news-filter-option w-full flex items-center justify-between gap-2 px-4 py-3 text-sm font-body text-ink hover:bg-primary/10 hover:text-primary transition-colors duration-200 border-t border-ink/5">
                <span class="flex items-center gap-2"><i class="fa-solid fa-arrow-up-short-wide text-xs" aria-hidden="true"></i> Terlama</span>
                <i class="fa-solid fa-check text-xs news-filter-check opacity-0 transition-opacity duration-200" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>

        <p id="news-loading" class="font-body text-ink-muted">Memuat berita...</p>
        <p id="news-empty" class="hidden font-body text-ink-muted">Belum ada event/berita terbaru saat ini.</p>
        <p id="news-error" class="hidden font-body text-ink-muted">Berita belum bisa dimuat, coba lagi nanti.</p>

        <div id="news-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 md:gap-6"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/assets/js/config.js?v=20261114"></script>
  <script src="/assets/js/page-loader.js?v=20261114"></script>
  <script src="/assets/js/utils.js?v=20261114"></script>
  <script src="/assets/js/partials.js?v=20261114"></script>
  <script src="/assets/js/scrollObserver.js?v=20261114"></script>
  <!-- <script src="/assets/js/cursor.js?v=20261114"></script> --> <!-- custom cursor on hold -->
  <script src="/assets/js/news.js?v=20261114"></script>
</body>
</html>
