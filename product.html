<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2M Sembako — Product</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn-uicons.flaticon.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://code.iconify.design">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/output.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-brands/css/uicons-brands.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js" defer></script>
</head>
<body data-page="product" class="bg-canvas text-ink font-body flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="flex-grow">
    <div class="bg-surface border-b border-ink/10">
      <section class="max-w-7xl mx-auto px-4 py-16">
        <span class="block w-12 h-1 bg-primary rounded-full mb-4"></span>
        <h1 class="font-display font-bold uppercase tracking-tight text-4xl text-ink">Katalog Produk</h1>
        <p class="font-body text-ink-muted mt-4 max-w-xl">Produk kami, dikelompokkan per kategori.</p>
      </section>
    </div>

    <section class="max-w-7xl mx-auto px-4 py-12 md:py-16">
      <p id="product-loading" class="font-body text-ink-muted">Memuat produk...</p>
      <p id="product-empty" class="hidden font-body text-ink-muted">Belum ada produk tersedia saat ini.</p>
      <p id="product-error" class="hidden font-body text-ink-muted">Produk belum bisa dimuat, coba lagi nanti.</p>

      <div id="product-filter" class="hidden flex gap-3 overflow-x-auto no-scrollbar pb-2 mb-8"></div>

      <div id="product-categories" class="hidden space-y-12 md:space-y-16"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/partials.js"></script>
  <script src="/assets/js/cursor.js"></script>
  <script src="/assets/js/product.js"></script>
</body>
</html>
