<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2M Sembako — Product</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn-uicons.flaticon.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://code.iconify.design">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/output.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-brands/css/uicons-brands.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js" defer></script>
</head>
<body data-page="product" class="bg-primary/5 text-ink font-body flex flex-col min-h-screen">
  <div id="page-loader"><div class="text-center"><div class="page-loader__brand">Loading</div><div class="page-loader__bar"></div></div></div>
  <div id="site-header"></div>

  <main class="flex-grow">
    <div class="bg-gradient-to-b from-ink to-ocean border-b border-white/10 pt-16 md:pt-20">
      <section class="max-w-7xl mx-auto px-4 py-16" data-animate>
        <span class="inline-block font-display font-bold uppercase tracking-widest text-xs text-white/70 mb-3">Belanja Kebutuhan Harian</span>
        <h1 class="font-display font-bold uppercase tracking-tight text-4xl text-white">Katalog Produk</h1>
        <p class="font-body text-white/70 mt-4 max-w-xl">Produk kami, dikelompokkan per kategori.</p>

        <div class="mt-6 flex flex-wrap gap-3">
          <span class="inline-flex items-center gap-2 bg-ocean/30 text-white text-xs font-display font-bold uppercase tracking-wide px-3 py-1.5 rounded-full border border-white/10">
            <i class="fa-solid fa-layer-group" aria-hidden="true"></i> Beragam Kategori
          </span>
          <span class="inline-flex items-center gap-2 bg-white/10 text-white text-xs font-display font-bold uppercase tracking-wide px-3 py-1.5 rounded-full border border-white/10">
            <i class="fa-solid fa-boxes-stacked" aria-hidden="true"></i> Stok Rutin Diperbarui
          </span>
        </div>
      </section>
    </div>

    <section class="max-w-7xl mx-auto px-4 py-12 md:py-16">
      <p id="product-loading" class="font-body text-ink-muted">Memuat produk...</p>
      <p id="product-empty" class="hidden font-body text-ink-muted">Belum ada produk tersedia saat ini.</p>
      <p id="product-error" class="hidden font-body text-ink-muted">Produk belum bisa dimuat, coba lagi nanti.</p>

      <div id="product-filter" class="hidden flex flex-wrap items-center justify-between gap-4 mb-8">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-body text-sm text-ink-muted">Menampilkan:</span>
          <span class="inline-flex items-center gap-1.5 bg-primary/10 text-primary text-xs font-display font-bold uppercase tracking-wide px-3 py-1.5 rounded-full">
            <i id="product-active-filter-icon" class="fa-solid fa-layer-group text-[11px]" aria-hidden="true"></i>
            <span id="product-active-filter-label">Semua</span>
          </span>
        </div>

        <div class="relative" id="product-filter-dropdown">
          <button id="product-filter-toggle" type="button"
            class="inline-flex items-center gap-2 bg-surface border border-ink/10 rounded-full px-4 py-2 text-sm font-display font-bold uppercase tracking-wide text-ink shadow-sm hover:border-primary/40 hover:shadow-md transition-all duration-300">
            <i class="fa-solid fa-sliders text-xs" aria-hidden="true"></i> Filter
            <i id="product-filter-chevron" class="fa-solid fa-chevron-down text-[10px] transition-transform duration-300" aria-hidden="true"></i>
          </button>

          <div id="product-filter-menu" class="hidden opacity-0 scale-95 origin-top-right transition-all duration-150 absolute right-0 mt-2 w-56 max-h-80 overflow-y-auto bg-surface rounded-2xl border border-ink/10 shadow-xl z-20"></div>
        </div>
      </div>

      <div id="product-categories" class="hidden space-y-12 md:space-y-16"></div>
    </section>
  </main>

  <!-- Product image lightbox: hidden by default, populated on-demand when a card is clicked -->
  <div id="product-image-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-md p-4 md:p-8 opacity-0 transition-opacity duration-300">
    <div id="product-image-modal-panel" class="relative bg-surface rounded-2xl max-w-2xl w-full shadow-2xl overflow-hidden opacity-0 scale-95 translate-y-4 transition-all duration-300">
      <button id="product-image-modal-close" type="button" class="absolute top-4 right-4 w-9 h-9 flex items-center justify-center bg-surface text-ink shadow-lg shadow-black/30 rounded-full hover:bg-primary hover:text-white hover:rotate-90 transition-all duration-300 z-10" aria-label="Tutup">
        <i class="fa-solid fa-xmark text-lg" aria-hidden="true"></i>
      </button>
      <div class="p-6 md:p-10 flex flex-col items-center">
        <img id="product-image-modal-image" src="" alt="" class="max-w-full max-h-[65vh] object-contain">
        <h3 id="product-image-modal-title" class="font-display font-bold uppercase tracking-tight text-lg text-ink mt-4 text-center"></h3>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/page-loader.js"></script>
  <script src="/assets/js/partials.js"></script>
  <script src="/assets/js/scrollObserver.js"></script>
  <!-- <script src="/assets/js/cursor.js"></script> --> <!-- custom cursor on hold -->
  <script src="/assets/js/product.js"></script>
</body>
</html>
